<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>Order Booker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #f4f6f9; --card: #fff; --text: #1b1f24; --muted: #667085; --line: #e3e7ed;
    --primary: #2e9e6a; --primary-dark: #23805a; --primary-text: #fff; --ok: #1a7f37; --warn: #b54708; --bad: #c62828;
    --ok-bg: #e7f6ec; --warn-bg: #fff4e5; --bad-bg: #fdecec; --info-bg: #e6f4ed;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: 72px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--primary); color: var(--primary-text); padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 8px; padding: 6px 10px; font-size: 14px; }
  .bar { font-size: 12px; color: var(--muted); padding: 6px 16px; background: #fff; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  main { padding: 12px 16px; max-width: 720px; margin: 0 auto; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line); display: flex; z-index: 5; padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: none; padding: 9px 4px 8px; font-size: 12px; color: var(--muted); }
  nav button b { display: block; font-size: 19px; line-height: 1.1; }
  nav button.on { color: var(--primary); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .right { text-align: right; }
  .big { font-size: 18px; font-weight: 700; }
  input, select, textarea { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  .btn { display: inline-block; border: 0; border-radius: 10px; padding: 11px 14px; font: inherit; font-weight: 600; background: var(--primary); color: var(--primary-text); text-align: center; }
  .btn.block { display: block; width: 100%; }
  .btn.light { background: var(--info-bg); color: var(--primary); }
  .btn.ok { background: var(--ok); color: #fff; }
  .btn.bad { background: var(--bad-bg); color: var(--bad); }
  .btn.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .5; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--info-bg); color: var(--primary); white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .list .item { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list .item:last-child { border-bottom: 0; }
  .tap { cursor: pointer; }
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 20px; }
  .qty input { width: 70px; text-align: center; padding: 7px; }
  .total { position: sticky; bottom: 64px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--bg); width: 100%; max-width: 720px; max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 14px 16px 24px; }
  .sheet h2 { font-size: 17px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .x { border: 0; background: none; font-size: 26px; line-height: 1; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 80px; z-index: 20; background: #1b1f24; color: #fff; padding: 12px 14px; border-radius: 10px; text-align: center; }
  .slip { background: #fff; border: 1px dashed #98a2b3; border-radius: 8px; padding: 12px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; white-space: pre-wrap; }
  .login { max-width: 380px; margin: 60px auto; }
  nav button { min-height: 58px; }

  /* ---- POS order screen: product grid + cart ---- */
  main.pos { max-width: none; padding: 0; }
  .pos-grid { display: block; }
  .pos-products { padding: 12px 16px 90px; }
  .pos-search { display: flex; gap: 8px; margin-bottom: 10px; }
  .pos-search input { padding: 12px 14px; font-size: 16px; border-radius: 10px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 6px; scrollbar-width: none; }
  .chip { flex: none; border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 99px; padding: 6px 12px; font: inherit; font-size: 13px; white-space: nowrap; }
  .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .pcard { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: left; font: inherit; color: var(--text); display: flex; flex-direction: column; gap: 4px; min-height: 120px; cursor: pointer; transition: border-color .1s, box-shadow .1s; }
  .pcard:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(46,158,106,.15); }
  .pcard:active { transform: scale(.98); }
  .pcard .pname { font-weight: 600; font-size: 14px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pcard .pmeta { font-size: 12px; color: var(--muted); }
  .pcard .pprice { margin-top: auto; font-weight: 700; color: var(--primary-dark); font-size: 15px; }
  .pcard .pstock { font-size: 12px; }
  .pcard .incart { position: absolute; top: -7px; right: -7px; background: var(--primary); color: #fff; border-radius: 99px; min-width: 24px; height: 24px; padding: 0 6px; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .pcard.out .pstock { color: var(--bad); }
  .cart { background: #fff; display: flex; flex-direction: column; }
  .cart-head { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .cart-lines { flex: 1; overflow-y: auto; padding: 4px 14px; }
  .cline { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .cline:last-child { border-bottom: 0; }
  .cart-foot { padding: 12px 14px; border-top: 1px solid var(--line); background: #fafbfc; }
  .cart-total { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 10px; }
  .cart-total b { font-size: 24px; }
  .cartbar { position: fixed; left: 12px; right: 12px; bottom: 68px; z-index: 6; background: var(--primary); color: #fff; border: 0; border-radius: 12px; padding: 12px 16px; font: inherit; font-weight: 600; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .cust-pick { display: flex; align-items: center; gap: 10px; border: 1px dashed var(--primary); border-radius: 10px; padding: 10px 12px; cursor: pointer; background: var(--info-bg); }
  .cust-pick.set { border-style: solid; background: #fff; border-color: var(--line); }

  /* ---- New order, laid out like the POS screen (/pos/create) ---- */
  .pos-wrap { padding: 12px 12px 150px; max-width: 1400px; margin: 0 auto; }
  .pos-box { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 6px rgba(16,24,40,.08); }
  .loc-pick { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 600; }
  .loc-pick select { width: auto; padding: 7px 10px; font-weight: 600; border-color: var(--primary); }
  .pos-top { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 14px; }
  .ig-wrap { position: relative; }
  .ig { display: flex; align-items: stretch; border: 1px solid #d0d5dd; border-radius: 6px; background: #fff; overflow: hidden; }
  .ig:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(46,158,106,.15); }
  .ig-icon { display: flex; align-items: center; justify-content: center; width: 42px; border-right: 1px solid #e4e7ec; background: #f9fafb; font-size: 15px; }
  .ig input { border: 0; border-radius: 0; flex: 1; padding: 11px 12px; font-size: 15px; outline: none; }
  .ig-btn { width: 44px; border: 0; border-left: 1px solid #e4e7ec; background: #fff; color: var(--primary); font-size: 22px; font-weight: 700; cursor: pointer; }
  .dd { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30; background: #fff; border-radius: 8px; box-shadow: 0 8px 24px rgba(16,24,40,.18); max-height: 360px; overflow-y: auto; }
  .dd:empty { display: none; }
  .dd-item { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid #f0f2f5; cursor: pointer; }
  .dd-item:hover, .dd-item.first { background: #eef8f2; }
  .dd-item.add { color: var(--primary); font-weight: 600; }
  .pos-table { width: 100%; border-collapse: collapse; }
  .pos-table th { background: #f2f6f4; text-align: left; padding: 10px 8px; font-size: 15px; border-bottom: 2px solid #e4e7ec; }
  .pos-table td { padding: 10px 8px; border-bottom: 1px solid #eef0f3; vertical-align: top; }
  .pos-table .c { text-align: center; } .pos-table .r { text-align: right; }
  .pos-table .qty { justify-content: center; }
  .unit-sel { margin-top: 6px; padding: 6px 8px; font-size: 13px; }
  .price-in { width: 120px; padding: 7px 8px; text-align: right; font-weight: 600; }
  @media (max-width: 899px) { .price-in { width: 110px; display: inline-block; } }
  .pos-sums { display: flex; gap: 40px; padding: 12px 8px 0; font-size: 16px; }
  .pos-bottom { position: fixed; left: 0; right: 0; bottom: 58px; z-index: 6; background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -2px 10px rgba(16,24,40,.06); display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .pbtn { border: 0; border-radius: 6px; padding: 12px 16px; font: inherit; font-weight: 700; color: #fff; cursor: pointer; }
  .pbtn.red { background: #dd2c2c; }
  .pbtn.green { background: #28b779; flex: 1; }
  .pbtn:disabled { opacity: .45; cursor: default; }
  .payable { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .payable span { font-weight: 700; font-size: 13px; line-height: 1.1; text-align: right; }
  .payable b { font-size: 24px; color: var(--primary-dark); }
  @media (max-width: 899px) {
    .pos-table thead { display: none; }
    .pos-table tr { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid #eef0f3; }
    .pos-table td { border: 0; padding: 0; }
    .pos-table td[data-label="Product"] { grid-column: 1; }
    .pos-table td:last-child { grid-column: 2; grid-row: 1; }
    .pos-table td[data-label="Quantity"] { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
    .pos-table td[data-label="Quantity"] .qty { justify-content: flex-start; }
    .pos-table td[data-label="Quantity"] .unit-sel { margin: 0; width: auto; flex: 1; }
    .pos-table td[data-label="Price"] { grid-column: 1; text-align: left; color: var(--muted); }
    .pos-table td[data-label="Price"]::before { content: "Price "; }
    .pos-table td[data-label="Subtotal"] { grid-column: 2; }
    .pos-table tr.empty-row { display: block; }
    .pos-sums { gap: 20px; }
    .pbtn { padding: 11px 12px; }
    .payable b { font-size: 20px; }
  }
  @media (min-width: 900px) {
    .pos-top { grid-template-columns: 1fr 1.6fr; gap: 24px; }
    .pos-bottom { bottom: 0; padding: 14px 20px; gap: 14px; }
    .pbtn.green { flex: none; min-width: 200px; }
    .pos-wrap { padding: 16px 16px 110px; }
  }
  .hdr-user { font-size: 13px; opacity: .9; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .tile .v { font-size: 22px; font-weight: 700; margin: 2px 0; }
  .tile .l { font-size: 12px; color: var(--muted); }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  .actions .btn { padding: 14px 8px; font-size: 13px; line-height: 1.6; }
  .dash-cols { display: grid; gap: 10px; }
  @media (max-width: 899px) { .pos-grid > .cart { display: none; } .hdr-user { display: none; } }

  /* Computer / tablet: tabs on top, products left, cart always on the right. */
  @media (min-width: 900px) {
    body { padding-bottom: 0; }
    #app { display: flex; flex-direction: column; min-height: 100vh; }
    header { order: 0; }
    nav { order: 1; position: sticky; top: 52px; bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); justify-content: flex-start; padding: 0 12px; z-index: 4; }
    nav button { flex: none; min-height: 0; padding: 10px 18px; font-size: 14px; display: flex; gap: 8px; align-items: center; border-bottom: 3px solid transparent; }
    nav button b { font-size: 16px; display: inline; }
    nav button.on { border-bottom-color: var(--primary); }
    .bar { order: 2; }
    main { order: 3; flex: 1; width: 100%; max-width: 900px; }
    main.pos { max-width: none; }
    .pos-grid { display: grid; grid-template-columns: 1fr 400px; height: calc(100vh - 128px); }
    .pos-products { overflow-y: auto; padding: 14px 18px 18px; }
    .cart { border-left: 1px solid var(--line); height: 100%; }
    .cartbar { display: none; }
    .total { position: static; }
    .toast { left: auto; right: 24px; bottom: 24px; max-width: 420px; }
    .modal { align-items: center; }
    .sheet { max-width: 560px; border-radius: 16px; max-height: 86vh; }
    .tiles { grid-template-columns: repeat(4, 1fr); }
    .tile .v { font-size: 26px; }
    .dash-cols { grid-template-columns: 1fr 1fr; }
    main:not(.pos) { max-width: 1100px; padding: 16px 24px; }
  }
  /* Print only the slip, receipt-sized (fits 80 mm thermal paper and A4). */
  @page { margin: 6mm; }
  @media print {
    body * { visibility: hidden !important; }
    #sheet .slip, #sheet .slip * { visibility: visible !important; }
    #sheet .slip { position: absolute; left: 0; top: 0; width: 72mm; border: 0; padding: 0; font-size: 11pt; line-height: 1.35; color: #000; }
    html, body { background: #fff !important; padding: 0 !important; }
  }
  .visit-bar { background: var(--ok); color: #fff; padding: 10px 16px; font-size: 14px; cursor: pointer; }
  .big-btn { font-size: 17px; padding: 14px; margin-bottom: 10px; }
  .shop-photo { display: block; width: 100%; max-height: 260px; object-fit: cover; border-radius: 10px; margin: 6px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js?v=17"></script>
</body>
</html>
